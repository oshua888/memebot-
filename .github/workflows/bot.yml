# Fait tourner le bot SIMULÉ sur les serveurs de GitHub.
# Les tâches programmées de GitHub sont irrégulières : chaque lancement fait donc
# tourner le bot ~5h30 (un cycle par minute) et publie l'état toutes les 5 minutes.
# Un nouveau lancement attend que le précédent soit fini (concurrency).
name: memebot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: memebot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publication du tableau de bord (GitHub Pages)
        run: python dashboard.py --export docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Bot (argent fictif) pendant ~5h30
        run: |
          git config user.name "memebot"
          git config user.email "memebot@users.noreply.github.com"
          touch bot.log && tail -n 3000 bot.log > bot.tmp && mv bot.tmp bot.log
          python -u memescanner.py bot --minutes 320 --sync-every 5 2>&1 | tee -a bot.log
